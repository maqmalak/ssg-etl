---
x-airflow-common: &airflow-common
  # Build Airflow image from your Dockerfile (with Spark client + requirements)
  build:
    context: .
    dockerfile: Dockerfile
    args:
      HOST_UID: ${AIRFLOW_UID:-50000}
      HOST_GID: ${AIRFLOW_GID:-0}
  image: airflow-custom:2.11.0-spark

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Asia/Karachi'
    AIRFLOW__CORE__TIMER_UNIT_CONSISTENCY: 'true'
    AIRFLOW__LOGGING__TRIGGERER_LOGGING_LEVEL: 'INFO'
    AIRFLOW__SCHEDULER__STANDALONE_DAG_PROCESSOR: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'ZsEBRWVIh8R54hysJ4WQOu_38bXMKdIhCB0AdbOMRuA'

    # Use Redis for rate limit storage instead of in-memory
    FLASK_LIMITER_STORAGE_URL: redis://:@redis:6379/0

    # Resource limits optimized for 24 cores and 64GB RAM
    # AIRFLOW__CORE__PARALLELISM: '32'
    # AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '24'
    # AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '60.0'
    # AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: '100'
    # AIRFLOW__WEBSERVER__WORKERS: '2'
    # AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '240'
    # AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '240'
    # AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # IMPORTANT:
    # We removed _PIP_ADDITIONAL_REQUIREMENTS because requirements are installed in Dockerfile.
    # _PIP_ADDITIONAL_REQUIREMENTS: ''

    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts
    - ${AIRFLOW_PROJ_DIR:-.}/sparkFiles:/opt/airflow/sparkFiles

  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow_network
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    env_file:
      - .env
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5438:5432"
    networks:
      - airflow_network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.5'
        reservations:
          memory: 2G
          cpus: '0.8'
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    command: redis-server --maxmemory 2500mb --maxmemory-policy allkeys-lru --appendonly yes
    expose:
      - 6379
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.0'
        reservations:
          memory: 1.5G
          cpus: '0.5'
    networks:
      - airflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8088:8080"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1.5G
          cpus: '0.8'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '3.0'
        reservations:
          memory: 5G
          cpus: '1.5'
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: '1.0'
        reservations:
          memory: 1.5G
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker-1:
    <<: *airflow-common
    command: celery worker
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '4.0'
        reservations:
          memory: 6G
          cpus: '2.5'
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
      AIRFLOW__CELERY__WORKER_CONCURRENCY: '8'
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker-2:
    <<: *airflow-common
    command: celery worker
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '4.0'
        reservations:
          memory: 6G
          cpus: '2.5'
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
      AIRFLOW__CELERY__WORKER_CONCURRENCY: '8'
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 0.5G
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,scripts,sparkFiles}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        rm -f /opt/airflow/logs/dag_processor/latest
        rm -f /opt/airflow/logs/scheduler/latest
        find /opt/airflow/logs -type l -name 'latest' -exec rm -f {} \;
        ionice -c 3 chown -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config,scripts,sparkFiles}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    networks:
      - airflow_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  spark-master:
    image: apache/spark:3.5.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_MEMORY: 4g
      SPARK_DRIVER_EXTRACLASSPATH: /opt/spark/work/jdbc-drivers/*
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/sparkFiles:/opt/spark/work
      - spark-master-data:/opt/spark/data
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always
    networks:
      - airflow_network

  spark-worker-1:
    image: apache/spark:3.5.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 8g
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_DRIVER_EXTRACLASSPATH: /opt/spark/work/jdbc-drivers/*
      SPARK_EXECUTOR_EXTRACLASSPATH: /opt/spark/work/jdbc-drivers/*
      SPARK_EXTRA_CLASSPATH: /opt/spark/work/jdbc-drivers/postgresql-42.7.3.jar:/opt/spark/work/jdbc-drivers/client-2.1.jar:/opt/spark/work/jdbc-drivers/saslprep-1.1.jar:/opt/spark/work/jdbc-drivers/stringprep-1.1.jar
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/sparkFiles:/opt/spark/work
      - spark-worker-1-data:/opt/spark/data
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '3.0'
        reservations:
          memory: 6G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://spark-master:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always
    networks:
      - airflow_network

  spark-worker-2:
    image: apache/spark:3.5.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 8g
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_DRIVER_EXTRACLASSPATH: /opt/spark/work/jdbc-drivers/*
      SPARK_EXECUTOR_EXTRACLASSPATH: /opt/spark/work/jdbc-drivers/*
      SPARK_EXTRA_CLASSPATH: /opt/spark/work/jdbc-drivers/postgresql-42.7.3.jar:/opt/spark/work/jdbc-drivers/client-2.1.jar:/opt/spark/work/jdbc-drivers/saslprep-1.1.jar:/opt/spark/work/jdbc-drivers/stringprep-1.1.jar
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/sparkFiles:/opt/spark/work
      - spark-worker-2-data:/opt/spark/data
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '3.0'
        reservations:
          memory: 6G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://spark-master:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always
    networks:
      - airflow_network

networks:
  airflow_network:
    driver: bridge

volumes:
  postgres-db-volume:
  spark-master-data:
  spark-worker-1-data:
  spark-worker-2-data:
