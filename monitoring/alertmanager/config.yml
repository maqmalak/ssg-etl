# AlertManager Configuration for ETL Pipeline
global:
  resolve_timeout: 5m

# Configure alert receivers
route:
  group_by: ['alertname', 'component', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true
    
    - match:
        component: airflow
      receiver: 'airflow-alerts'
    
    - match:
        component: database
      receiver: 'database-alerts'
    
    - match:
        component: spark
      receiver: 'spark-alerts'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/critical'
        send_resolved: true
    # Add email, Slack, PagerDuty configurations here
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'password'

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/warning'
        send_resolved: true

  - name: 'airflow-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/airflow'
        send_resolved: true

  - name: 'database-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/database'
        send_resolved: true

  - name: 'spark-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/spark'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component', 'instance']
