# StatsD to Prometheus Metrics Mapping for Airflow
mappings:
  # DAG processing metrics
  - match: "airflow.dagbag.import_errors"
    name: "airflow_dagbag_import_errors"
    labels:
      component: "dagbag"

  - match: "airflow.dagbag.dag_processing.import_errors"
    name: "airflow_dagbag_dag_processing_import_errors"
    labels:
      component: "dagbag"

  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_processing_last_duration"
    match_type: regex
    labels:
      dag_file: "$1"

  - match: "airflow.dag_processing.last_run.*"
    name: "airflow_dag_processing_last_run"
    match_type: regex
    labels:
      dag_file: "$1"

  # Task instance metrics
  - match: "airflow.ti_failures"
    name: "airflow_task_instance_failures"
    labels:
      component: "task"

  - match: "airflow.ti_successes"
    name: "airflow_task_instance_successes"
    labels:
      component: "task"

  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration"
    match_type: regex
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_processing_duration"
    match_type: regex
    labels:
      dag_file: "$1"

  # Scheduler metrics
  - match: "airflow.scheduler.tasks.starving"
    name: "airflow_scheduler_tasks_starving"
    labels:
      component: "scheduler"

  - match: "airflow.scheduler.tasks.executable"
    name: "airflow_scheduler_tasks_executable"
    labels:
      component: "scheduler"

  - match: "airflow.scheduler.tasks.running"
    name: "airflow_scheduler_tasks_running"
    labels:
      component: "scheduler"

  - match: "airflow.scheduler.tasks.without_dagrun"
    name: "airflow_scheduler_tasks_without_dagrun"
    labels:
      component: "scheduler"

  - match: "airflow.scheduler.heartbeat"
    name: "airflow_scheduler_heartbeat"
    labels:
      component: "scheduler"

  # Executor metrics
  - match: "airflow.executor.open_slots"
    name: "airflow_executor_open_slots"
    labels:
      component: "executor"

  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"
    labels:
      component: "executor"

  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"
    labels:
      component: "executor"

  # Pool metrics
  - match: "airflow.pool.open_slots.*"
    name: "airflow_pool_open_slots"
    match_type: regex
    labels:
      pool: "$1"

  - match: "airflow.pool.queued_slots.*"
    name: "airflow_pool_queued_slots"
    match_type: regex
    labels:
      pool: "$1"

  - match: "airflow.pool.running_slots.*"
    name: "airflow_pool_running_slots"
    match_type: regex
    labels:
      pool: "$1"

  - match: "airflow.pool.starving_tasks.*"
    name: "airflow_pool_starving_tasks"
    match_type: regex
    labels:
      pool: "$1"

  # DAG run metrics
  - match: "airflow.dagrun.*.first_task_scheduling_delay"
    name: "airflow_dagrun_first_task_scheduling_delay"
    match_type: regex
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.dependency-check.*"
    name: "airflow_dagrun_dependency_check"
    match_type: regex
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_success"
    match_type: regex
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_failed"
    match_type: regex
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.schedule_delay.*"
    name: "airflow_dagrun_schedule_delay"
    match_type: regex
    labels:
      dag_id: "$1"

  # Celery metrics
  - match: "airflow.celery.task_timeout_error"
    name: "airflow_celery_task_timeout_error"
    labels:
      component: "celery"

  - match: "airflow.celery.worker_.*"
    name: "airflow_celery_worker_up"
    match_type: regex
    labels:
      worker: "$1"

  # Smart sensor metrics
  - match: "airflow.smart_sensor.poked_tasks"
    name: "airflow_smart_sensor_poked_tasks"
    labels:
      component: "smart_sensor"

  - match: "airflow.smart_sensor.poked_success"
    name: "airflow_smart_sensor_poked_success"
    labels:
      component: "smart_sensor"

  - match: "airflow.smart_sensor.poked_exception"
    name: "airflow_smart_sensor_poked_exception"
    labels:
      component: "smart_sensor"

  # Triggerer metrics
  - match: "airflow.triggers.running"
    name: "airflow_triggers_running"
    labels:
      component: "triggerer"

  - match: "airflow.triggers.succeeded"
    name: "airflow_triggers_succeeded"
    labels:
      component: "triggerer"

  - match: "airflow.triggers.failed"
    name: "airflow_triggers_failed"
    labels:
      component: "triggerer"

defaults:
  timer_type: histogram
  buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120, 300, 600]
  match_type: glob
  ttl: 0
