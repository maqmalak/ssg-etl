version: '3.8'

services:
  # Spark Master Node
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "7077:7077"   # Spark master port for worker communication
      - "9090:8080"   # Spark master web UI
      - "4040:4040"   # Spark application UI
    volumes:
      - ./sparkFiles:/opt/spark/work
      - ./sparkFiles/jdbc-drivers:/opt/bitnami/spark/jars
      - ./dags:/opt/spark/dags
      - ./logs:/opt/spark/logs
    networks:
      - etl-network
    restart: unless-stopped

  # Spark Worker 1
  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=12G
      - SPARK_WORKER_CORES=4
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8081:8081"   # Worker 1 web UI
    volumes:
      - ./sparkFiles:/opt/spark/work
      - ./sparkFiles/jdbc-drivers:/opt/bitnami/spark/jars
      - ./dags:/opt/spark/dags
      - ./logs:/opt/spark/logs
    networks:
      - etl-network
    restart: unless-stopped

  # Spark Worker 2
  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=12G
      - SPARK_WORKER_CORES=4
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8082:8081"   # Worker 2 web UI
    volumes:
      - ./sparkFiles:/opt/spark/work
      - ./sparkFiles/jdbc-drivers:/opt/bitnami/spark/jars
      - ./dags:/opt/spark/dags
      - ./logs:/opt/spark/logs
    networks:
      - etl-network
    restart: unless-stopped

networks:
  etl-network:
    external: true
